name: Build and Deploy

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - "src/**"
      - "Dockerfile"
      - "package.json"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: write

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: express-app
  NODE_VERSION: "20"

jobs:
  detect-environment:
    name: Detect Target Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      should-deploy: ${{ steps.env.outputs.should-deploy }}
    steps:
      - name: Determine environment and deployment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH="${{ github.base_ref }}"
            SHOULD_DEPLOY="false"
          else
            BRANCH="${{ github.ref_name }}"
            SHOULD_DEPLOY="true"
          fi

          if [[ "$BRANCH" == "main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == "staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

          echo "should-deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT

          echo "### 🎯 Target Environment: \`${BRANCH}\` → \`$(grep 'environment=' <<< "$(cat $GITHUB_OUTPUT)" | cut -d'=' -f2)\`" >> $GITHUB_STEP_SUMMARY
          echo "**Will Deploy:** $SHOULD_DEPLOY" >> $GITHUB_STEP_SUMMARY

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: detect-environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for gitleaks

      - name: Run gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run Hadolint (Dockerfile Linting)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [detect-environment, security-scan]
    if: needs.detect-environment.outputs.should-deploy == 'true'
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deployment-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-BuildPush

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ needs.detect-environment.outputs.environment }}
            type=raw,value=${{ needs.detect-environment.outputs.environment }}-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.detect-environment.outputs.environment }}-${{ github.sha }}
          format: "sarif"
          output: "trivy-image-results.sarif"

      - name: Upload Trivy image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"

      - name: Wait for ECR scan
        run: |
          ENV_TAG="${{ needs.detect-environment.outputs.environment }}-${{ github.sha }}"

          echo "Waiting for ECR vulnerability scan..."
          sleep 30

          aws ecr wait image-scan-complete \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-id imageTag=$ENV_TAG \
            --region ${{ env.AWS_REGION }} || true

      - name: Get ECR scan results
        id: ecr-scan
        run: |
          ENV_TAG="${{ needs.detect-environment.outputs.environment }}-${{ github.sha }}"

          SCAN_FINDINGS=$(aws ecr describe-image-scan-findings \
            --repository-name ${{ env.ECR_REPOSITORY }} \
            --image-id imageTag=$ENV_TAG \
            --region ${{ env.AWS_REGION }} \
            --query 'imageScanFindings.findingSeverityCounts' \
            --output json)

          echo "scan-results=$SCAN_FINDINGS" >> $GITHUB_OUTPUT

          echo "## 🔍 ECR Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** \`${{ needs.detect-environment.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          echo "$SCAN_FINDINGS" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [detect-environment, build]
    if: needs.detect-environment.outputs.should-deploy == 'true'
    environment:
      name: ${{ needs.detect-environment.outputs.environment }}
      url: http://${{ steps.get-alb.outputs.alb-dns }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-deployment-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy

      - name: Get ALB DNS
        id: get-alb
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"

          TG_ARN=$(aws elbv2 describe-target-groups \
            --names express-app-${ENV}-alb-tg \
            --region ${{ env.AWS_REGION }} \
            --query 'TargetGroups[0].LoadBalancerArns[0]' \
            --output text)

          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --load-balancer-arns $TG_ARN \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "alb-dns=$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Update ECS service
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"
          CLUSTER="express-app-${ENV}-cluster"
          SERVICE="express-app-${ENV}-service"

          echo "Updating ECS service: $SERVICE in cluster: $CLUSTER"

          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"
          CLUSTER="express-app-${ENV}-cluster"
          SERVICE="express-app-${ENV}-service"

          echo "Waiting for ECS service to stabilize..."
          aws ecs wait services-stable \
            --cluster $CLUSTER \
            --services $SERVICE \
            --region ${{ env.AWS_REGION }}

      - name: Verify deployment
        id: verify
        run: |
          ALB_DNS="${{ steps.get-alb.outputs.alb-dns }}"

          echo "Testing health endpoint..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://$ALB_DNS/health)

          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Health check passed"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Health check failed with status $RESPONSE"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: AI Deployment Analysis
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ENV="${{ needs.detect-environment.outputs.environment }}"
          SERVICE="express-app-${ENV}-service"

          # Get recent CloudWatch logs
          LOG_EVENTS=$(aws logs filter-log-events \
            --log-group-name /ecs/${SERVICE} \
            --start-time $(($(date +%s) - 300))000 \
            --limit 50 \
            --region ${{ env.AWS_REGION }} \
            --query 'events[*].message' \
            --output text | head -c 2000)

          PROMPT="Analyze this ECS deployment and provide insights:

          Environment: ${{ needs.detect-environment.outputs.environment }}
          Deployment Status: ${{ steps.verify.outputs.status }}
          Commit: ${{ github.sha }}

          Recent logs:
          $LOG_EVENTS

          Provide:
          1. Deployment health assessment
          2. Any errors or warnings detected
          3. Performance recommendations
          Keep response under 150 words."

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [{\"role\": \"user\", \"content\": $(echo "$PROMPT" | jq -Rs .)}],
              \"temperature\": 0.7,
              \"max_tokens\": 250
            }")

          AI_ANALYSIS=$(echo $RESPONSE | jq -r '.choices[0].message.content')

          echo "## 🤖 AI Deployment Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "$AI_ANALYSIS" >> $GITHUB_STEP_SUMMARY

      - name: Post deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ needs.build.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ needs.build.outputs.image-digest }}" >> $GITHUB_STEP_SUMMARY
          echo "**Health Check:** http://${{ steps.get-alb.outputs.alb-dns }}/health" >> $GITHUB_STEP_SUMMARY
